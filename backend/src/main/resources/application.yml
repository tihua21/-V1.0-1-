# 服务器端口
server:
  port: 8080

# 数据源配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/meeting_room?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 驼峰映射：数据库 created_at -> Java createdAt
    map-underscore-to-camel-case: true
    # 打印 SQL 日志（开发阶段用，上线注释掉）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto

# 日志级别
logging:
  level:
    com.meetingroom: debug
